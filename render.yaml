services:
  - type: web
    name: supportpilot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: supportpilot-db
          property: connectionString

  - type: psql
    name: supportpilot-db
    plan: free
