<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SupportPilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center py-5" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="light-card p-5">
                    <div class="text-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary mb-3"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        <h3 class="fw-bold text-dark">Create an Account</h3>
                        <p class="text-muted">Join SupportPilot to manage your IT tickets</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #b91c1c;">
                        <div class="d-flex align-items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            {{ error }}
                        </div>
                    </div>
                    {% endif %}

                    <form action="/signup" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-dark small fw-medium">Full Name</label>
                            <input type="text" class="form-control" name="full_name" required placeholder="e.g. Jane Doe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dark small fw-medium">Email Address</label>
                            <input type="email" class="form-control" name="email" required placeholder="name@company.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dark small fw-medium">Department</label>
                            <select class="form-select" name="department" required>
                                <option value="" selected disabled>Select Department</option>
                                <option value="IT">IT</option>
                                <option value="Sales">Sales</option>
                                <option value="HR">HR</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Operations">Operations</option>
                            </select>
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label text-dark small fw-medium">Password</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark small fw-medium">Confirm Password</label>
                                <input type="password" class="form-control" name="confirm_password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                            Sign Up
                        </button>
                        <div class="text-center text-muted small mt-4">
                            Already have an account? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 500;">Sign in</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
